{% extends 'base.html' %}

{% block content %}


<style>
    .delete-item {
        width: 75px;
        height: 30px;
        text-indent: 0;
    }


    a{
        text-decoration: none;
        color: white;
    }
</style>

<form action="" method="POST">
    {% csrf_token %}
    <p>Are you sure you want to delete "{{obj}}?</p>
    <input class="delete-item" type="submit" value="Confirm">

    <!--Return to the previous page-->
    <a href="{{request.META.HTTP_REFERER}}">Go back</a>
</form>

{% endblock %}
